<form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
  <div>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" [(ngModel)]="user.email" required />
  </div>
  <!-- <input type="email" name="email" [(ngModel)]="user.email" required placeholder="Email" /> -->
  <!-- <input type="password" name="password" [(ngModel)]="user.password" required placeholder="Mot de passe" /> -->
  <div>
    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" [(ngModel)]="user.password" required />
  </div>

  @if (this.errorMessage) {
  <span>{{this.errorMessage}}</span>
  }


  <button type="submit" [disabled]="loginForm.invalid">Se connecter</button>
</form>
